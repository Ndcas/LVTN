syntax = "proto3";

package notification;

service NotificationService {
    rpc GetAllNotificationsByUserId(GetAllNotificationsByUserIdRequest) returns (GetAllNotificationsByUserIdResponse) {}
}

message GetAllNotificationsByUserIdRequest {
    int32 id = 1;
    int32 page = 2;
    int32 limit = 3;
    string correlationId = 4;
}

message NotificationItem {
    int32 id = 1;
    int32 userId = 2;
    string title = 3;
    string content = 4;
    string createdAt = 5;
}

message GetAllNotificationsByUserIdResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    repeated NotificationItem data = 5;
    int32 total = 6;
    int32 page = 7;
    int32 limit = 8;
}
