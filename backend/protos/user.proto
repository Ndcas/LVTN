syntax = "proto3";

package user;

service UserService {
  rpc GetRegisterOtp(GetRegisterOtpRequest) returns (BaseResponse) {}
  rpc Register(RegisterRequest) returns (BaseResponse) {}
  rpc Login(LoginRequest) returns (AuthResponse) {}
  rpc Refresh(RefreshRequest) returns (AuthResponse) {}
  rpc Logout(LogoutRequest) returns (BaseResponse) {}
  rpc GetForgotPasswordOtp(GetForgotPasswordOtpRequest) returns (BaseResponse) {}
  rpc ForgotPassword(ForgotPasswordRequest) returns (BaseResponse) {}
}

message PingRequest {}

message PingResponse {
  string message = 1;
}

message BaseResponse {
  bool ok = 1;
  int32 status = 2;
  string error = 3;
  string message = 4;
}

message GetRegisterOtpRequest {
  string email = 1;
  string correlationId = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string phone = 3;
  string fullName = 4;
  string gender = 5;
  string dob = 6;
  string address = 7;
  string otp = 8;
  string correlationId = 9;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string correlationId = 3;
}

message RefreshRequest {
  string refreshToken = 1;
  string correlationId = 2;
}

message LogoutRequest {
  string refreshToken = 1;
  string correlationId = 2;
}

message GetForgotPasswordOtpRequest {
  string email = 1;
  string correlationId = 2;
}

message ForgotPasswordRequest {
  string email = 1;
  string otp = 2;
  string password = 3;
  string correlationId = 4;
}

message AuthResponse {
  bool ok = 1;
  int32 status = 2;
  string error = 3;
  string message = 4;
  string accessToken = 5;
  string refreshToken = 6;
  int32 role = 7;
}
