syntax = "proto3";

package schedule;

service ScheduleService {
    
    // === OpeningTime ===
    rpc GetOpeningTime(EmptyRequest) returns (GetOpeningTimeResponse) {}

    // === GlobalHoliday ===
    rpc GetAllHolidays(EmptyRequest) returns (GetAllHolidaysResponse) {}
    rpc CreateHoliday(CreateHolidayRequest) returns (BaseResponse) {}
    rpc UpdateHoliday(UpdateHolidayRequest) returns (BaseResponse) {}
    rpc DeleteHoliday(IdRequest) returns (BaseResponse) {}

    // === DoctorWeeklyTemplate ===
    rpc GetWeeklyTemplateByDoctor(IdRequest) returns (GetWeeklyTemplateByDoctorResponse) {}

    // === Timeslot ===
    rpc GetAvailableTimeSlots(GetAvailableTimeSlotsRequest) returns (GetAvailableTimeSlotsResponse) {}
    rpc ScheduleTimeSlots(EmptyRequest) returns (BaseResponse) {}
    rpc DeleteOldTimeSlots(EmptyRequest) returns (BaseResponse) {}
    rpc GetTodayAppointmentsCount(EmptyRequest) returns (CountResponse) {}

    // === Booking ===
    rpc GetAllBookings(GetAllBookingsRequest) returns (GetAllBookingsResponse) {}
    rpc GetBookingById(IdRequest) returns (GetBookingByIdResponse) {}
    rpc CreateBooking(CreateBookingRequest) returns (BaseResponse) {}
    rpc UpdateBookingStatus(UpdateBookingStatusRequest) returns (BaseResponse) {}
    rpc FinishBooking(FinishBookingRequest) returns (BaseResponse) {}
    rpc GetVideoCallToken(GetVideoCallTokenRequest) returns (GetVideoCallTokenResponse) {}

    // === DoctorLeave ===
    rpc GetAllDoctorLeaves(GetAllDoctorLeavesRequest) returns (GetAllDoctorLeavesResponse) {}
    rpc CreateDoctorLeave(CreateDoctorLeaveRequest) returns (BaseResponse) {}
    rpc UpdateDoctorLeave(UpdateDoctorLeaveRequest) returns (BaseResponse) {}

    // === ChangeRequest ===
    rpc CreateScheduleChangeRequest(CreateScheduleChangeRequestRequest) returns (BaseResponse) {}
    rpc GetAllScheduleChangeRequests(GetAllScheduleChangeRequestsRequest) returns (GetAllScheduleChangeRequestsResponse) {}
    rpc GetScheduleChangeRequestById(GetScheduleChangeRequestByIdRequest) returns (GetScheduleChangeRequestByIdResponse) {}
    rpc UpdateScheduleChangeRequest(UpdateScheduleChangeRequestRequest) returns (BaseResponse) {}
}

// === Common Message ===
message EmptyRequest {
    string correlationId = 1;
}

message IdRequest {
    int32 id = 1;
    string correlationId = 2;
}

message BaseResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
}

message CountResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    int32 count = 4;
}

// === OpeningTime ===
message OpeningTimeItem {
    string dayOfWeek = 1;
    string startTime = 2;
    string endTime = 3;
}

message GetOpeningTimeResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    repeated OpeningTimeItem data = 5;
}

// === GlobalHoliday ===
message HolidayItem {
    string id = 1;
    string holidayDate = 2;
    string name = 3;
    string description = 4;
}

message GetAllHolidaysResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    repeated HolidayItem data = 5;
}

message CreateHolidayRequest {
    string correlationId = 1;
    string holidayDate = 2;
    string name = 3;
    string description = 4;
}

message UpdateHolidayRequest {
    string correlationId = 1;
    int32 id = 2;
    optional string name = 3;
    optional string description = 4;
}

// === DoctorWeeklyTemplate ===
message WeeklyTemplateItem {
    string dayOfWeek = 1;
    string startTime = 2;
    string endTime = 3;
    string clinicType = 4;
}

message GetWeeklyTemplateByDoctorResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    repeated WeeklyTemplateItem data = 5;
}

// === Timeslot ===
message GetAvailableTimeSlotsRequest {
    repeated int32 doctorIds = 1;
    string date = 2;
    string startTime = 3;
    string endTime = 4;
    string clinicType = 5;
    string correlationId = 6;
}

message TimeslotItem {
    int32 id = 1;
    int32 doctorId = 2;
    string startTime = 3;
    string endTime = 4;
}

message GetAvailableTimeSlotsResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    repeated TimeslotItem data = 5;
}

// === Booking ===
message GetAllBookingsRequest {
    int32 page = 1;
    int32 limit = 2;
    int32 userId = 3;
    int32 roleId = 4;
    optional string status = 5;
    string correlationId = 6;
}

message BookingItem {
    int32 id = 1;
    string status = 2;
    string clinicDate = 3;
    string clinicType = 4;
    string startTime = 5;
    string endTime = 6;
    string createdAt = 7;
    string updatedAt = 8;
    int32 patientId = 9;
    int32 doctorId = 10;
    int32 timeSlotId = 11;
}

message GetAllBookingsResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    repeated BookingItem data = 5;
    int32 total = 6;
    int32 page = 7;
    int32 limit = 8;
}

message GetBookingByIdResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    BookingItem data = 5;
}

message CreateBookingRequest {
    int32 timeSlotId = 1;
    int32 patientId = 2;
    string correlationId = 3;
}

message UpdateBookingStatusRequest {
    int32 bookingId = 1;
    int32 userId = 2;
    string status = 3;
    string correlationId = 4;
}

message PrescriptionDetailInput {
    int32 medicineId = 1;
    int32 quantity = 2;
    string dosage = 3;
}

message FinishBookingRequest {
    int32 bookingId = 1;
    int32 doctorId = 2;
    string clinicalIndicators = 3;
    optional int32 diseaseId = 4;
    string diagnoseDetail = 5;
    repeated PrescriptionDetailInput prescriptionDetails = 6;
    string correlationId = 7;
}

message GetVideoCallTokenRequest {
    int32 userId = 1;
    int32 bookingId = 2;
    string correlationId = 3;
}

message GetVideoCallTokenResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    int32 userId = 5;
    string channelName = 6;
    string token = 7;
}

// === DoctorLeave ===
message DoctorLeaveItem {
    int32 id = 1;
    int32 doctorId = 2;
    string leaveDate = 3;
    string reason = 4;
    string status = 5;
    string rejectedReason = 6;
    string createdAt = 7;
    string updatedAt = 8;
}

message GetAllDoctorLeavesRequest {
    int32 page = 1;
    int32 limit = 2;
    optional int32 doctorId = 3;
    optional string status = 4;
    string correlationId = 5;
}

message GetAllDoctorLeavesResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    repeated DoctorLeaveItem data = 5;
    int32 total = 6;
    int32 page = 7;
    int32 limit = 8;
}

message CreateDoctorLeaveRequest {
    int32 doctorId = 1;
    string leaveDate = 2;
    string reason = 3;
    string correlationId = 4;
}

message UpdateDoctorLeaveRequest {
    int32 id = 1;
    string status = 2;
    optional string rejectedReason = 3;
    string correlationId = 4;
}

// === ScheduleChangeRequest
message ScheduleChangeRequestDetailItem {
    int32 id = 1;
    int32 requestId = 2;
    int32 doctorId = 3;
    int32 dayOfWeek = 4;
    string startTime = 5;
    string endTime = 6;
    string clinicType = 7;
    string createdAt = 8;
}

message ScheduleChangeRequestItem {
    int32 id = 1;
    int32 doctorId = 2;
    string status = 3;
    string rejectedReason = 4;
    string createdAt = 5;
    string updatedAt = 6;
    repeated ScheduleChangeRequestDetailItem scheduleChangeRequestDetails = 7;
}

message CreateScheduleChangeRequestRequest {
    int32 doctorId = 1;
    repeated ScheduleChangeRequestDetailItem details = 2;
    string correlationId = 3;
}

message GetAllScheduleChangeRequestsRequest {
    int32 page = 1;
    int32 limit = 2;
    optional int32 doctorId = 3;
    optional string status = 4;
    string correlationId = 5;
}

message GetAllScheduleChangeRequestsResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    repeated ScheduleChangeRequestItem data = 5;
    int32 total = 6;
    int32 page = 7;
    int32 limit = 8;
}

message GetScheduleChangeRequestByIdRequest {
    int32 id = 1;
    int32 doctorId = 2;
    string correlationId = 3;
}

message GetScheduleChangeRequestByIdResponse {
    bool ok = 1;
    int32 status = 2;
    string error = 3;
    string message = 4;
    ScheduleChangeRequestItem data = 5;
}

message UpdateScheduleChangeRequestRequest {
    int32 id = 1;
    string status = 2;
    optional string rejectedReason = 3;
    string correlationId = 4;
}